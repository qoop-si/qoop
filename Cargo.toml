[workspace]
resolver = "3"
members = [
    "crates/qoop-domain",
    "crates/qoop-events",
    "crates/qoop-move",
    "crates/qoop-plugin",
    "crates/qoop-proto",
    "crates/qoop-remote",
    "crates/qoop-pty",
    "crates/qoop-runtime",
    "crates/qoop-setup",
    "crates/qoop-store",
    "crates/qoop-support",
    "crates/qoop-terminal",
    "crates/qoop-cli",
    "crates/qoop-tui",
    "crates/qoop-collab",
    "crates/qoop-testkit",
    "crates/qoop-attention",
    "crates/qoop-bench",
    "crates/qoop-detect",
    "crates/qoop-history",
    "crates/qoop-parsed",
    "crates/qoop-desktop",
    "spikes/spike-runtime",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
proptest = "1"
libc = "0.2"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
toml_edit = "0.22"
agentparse = { git = "https://github.com/qoop-si/agentparse", rev = "76670fbae830aa137f0c757fde97ee460908b0dc" }

[profile.release]
debug = 1

# Dependencies optimized in debug builds too, as Zed does: GPUI's layout, text and hashing at
# opt-level 0 draw the desktop window at a fraction of the display's rate, and the CI bundle is
# a debug build. The workspace's own crates stay at 0 and compile as fast as before.
[profile.dev.package."*"]
opt-level = 3
