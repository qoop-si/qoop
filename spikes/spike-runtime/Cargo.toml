[package]
name = "spike-runtime"
version = "0.16.1"
edition = "2024"
publish = false

[dependencies]
libc = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
alacritty_terminal = "0.26"

[[bin]]
name = "spike-pty"
path = "src/pty.rs"

[[bin]]
name = "spike-term"
path = "src/term.rs"

[[bin]]
name = "spike-proc"
path = "src/proc.rs"

[[bin]]
name = "spike-teardown"
path = "src/teardown.rs"

[[bin]]
name = "spike-mem"
path = "src/mem.rs"
