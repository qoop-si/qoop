<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qoop docs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="reading-progress" id="reading-progress"></div>

  <header class="navbar">
    <button class="icon-btn hamburger" id="hamburger" aria-label="Pages" aria-controls="sidebar" aria-expanded="false">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <a href="/" class="logo" aria-label="qoop.si home">
      <svg viewBox="112 75 919 233" aria-hidden="true"><circle cx="134.4" cy="97.6" r="22.4" fill="currentColor"/><circle cx="196.8" cy="97.6" r="22.4" fill="currentColor"/><circle cx="259.2" cy="97.6" r="22.4" fill="currentColor"/><circle cx="134.4" cy="160.0" r="22.4" fill="currentColor"/><circle cx="259.2" cy="160.0" r="22.4" fill="currentColor"/><circle cx="134.4" cy="222.4" r="22.4" fill="currentColor"/><circle cx="196.8" cy="222.4" r="22.4" fill="currentColor"/><circle cx="259.2" cy="222.4" r="22.4" fill="currentColor"/><circle cx="259.2" cy="284.8" r="22.4" fill="#FD4B03"/><circle cx="384.0" cy="97.6" r="22.4" fill="currentColor"/><circle cx="446.4" cy="97.6" r="22.4" fill="currentColor"/><circle cx="508.8" cy="97.6" r="22.4" fill="currentColor"/><circle cx="384.0" cy="160.0" r="22.4" fill="currentColor"/><circle cx="508.8" cy="160.0" r="22.4" fill="currentColor"/><circle cx="384.0" cy="222.4" r="22.4" fill="currentColor"/><circle cx="446.4" cy="222.4" r="22.4" fill="currentColor"/><circle cx="508.8" cy="222.4" r="22.4" fill="currentColor"/><circle cx="633.6" cy="97.6" r="22.4" fill="currentColor"/><circle cx="696.0" cy="97.6" r="22.4" fill="currentColor"/><circle cx="758.4" cy="97.6" r="22.4" fill="currentColor"/><circle cx="633.6" cy="160.0" r="22.4" fill="currentColor"/><circle cx="758.4" cy="160.0" r="22.4" fill="currentColor"/><circle cx="633.6" cy="222.4" r="22.4" fill="currentColor"/><circle cx="696.0" cy="222.4" r="22.4" fill="currentColor"/><circle cx="758.4" cy="222.4" r="22.4" fill="currentColor"/><circle cx="883.2" cy="97.6" r="22.4" fill="currentColor"/><circle cx="945.6" cy="97.6" r="22.4" fill="currentColor"/><circle cx="1008.0" cy="97.6" r="22.4" fill="currentColor"/><circle cx="883.2" cy="160.0" r="22.4" fill="currentColor"/><circle cx="1008.0" cy="160.0" r="22.4" fill="currentColor"/><circle cx="883.2" cy="222.4" r="22.4" fill="currentColor"/><circle cx="945.6" cy="222.4" r="22.4" fill="currentColor"/><circle cx="1008.0" cy="222.4" r="22.4" fill="currentColor"/><circle cx="883.2" cy="284.8" r="22.4" fill="#FD4B03"/></svg>
    </a>
    <nav class="navbar-links"></nav>
    <span class="navbar-gap"></span>
    <button class="search-trigger" id="search-trigger" aria-label="Search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="search-label">Search</span>
      <kbd class="search-shortcut">&#8984;K</kbd>
    </button>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
      <svg class="i icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <div class="overlay" id="overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="sidebar-nav"></nav>
    </aside>

    <main class="content" id="content">
      <div id="home"></div>
      <article id="article"></article>
      <footer class="footer"></footer>
    </main>

    <aside class="keys" id="keys" aria-label="Keys">
      <div class="keys-head">
        <div class="keys-title">
          <svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M7.5 14h9"/></svg>
          <b>Keys</b>
          <span class="keys-prefix">prefix <kbd class="pre">ctrl-a</kbd></span>
          <button class="icon-btn keys-close" id="keys-close" aria-label="Close keys">
            <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <label class="keys-filter">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="keys-filter" placeholder="Filter keys: split, copy, sleep" autocomplete="off">
        </label>
      </div>
      <div class="keys-list" id="keys-list"></div>
    </aside>
  </div>

  <button class="keys-fab" id="keys-fab" aria-label="Show keys">
    <svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M7.5 14h9"/></svg>
    Keys
  </button>

  <div class="search-modal" id="search-modal">
    <div class="search-modal-content" role="dialog" aria-modal="true" aria-label="Search the docs">
      <div class="search-input-wrapper">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="search-input" placeholder="Search the docs" autocomplete="off" aria-label="Search the docs" role="combobox" aria-controls="search-results" aria-autocomplete="list" aria-expanded="false">
        <kbd>esc</kbd>
      </div>
      <div class="search-results" id="search-results" role="listbox" aria-label="Results"></div>
    </div>
  </div>

  <div class="sr-only" id="status" role="status"></div>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
