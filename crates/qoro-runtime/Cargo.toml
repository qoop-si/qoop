[package]
name = "qoro-runtime"
version = "0.7.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
qoro-store = { path = "../qoro-store" }
bytes = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
qoro-domain = { path = "../qoro-domain" }
qoro-proto = { path = "../qoro-proto" }
qoro-pty = { path = "../qoro-pty" }
qoro-terminal = { path = "../qoro-terminal" }
qoro-detect = { path = "../qoro-detect" }
rusqlite = { workspace = true }
# config.toml, the same file and crate the interface reads it with.
toml = { workspace = true }
unicode-width = "0.2"
tempfile = { workspace = true }

[dev-dependencies]
qoro-store = { path = "../qoro-store" }
qoro-testkit = { path = "../qoro-testkit" }
