[package]
name = "qoop-runtime"
version = "0.12.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
qoop-store = { path = "../qoop-store" }
bytes = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
qoop-domain = { path = "../qoop-domain" }
qoop-proto = { path = "../qoop-proto" }
qoop-pty = { path = "../qoop-pty" }
qoop-terminal = { path = "../qoop-terminal" }
qoop-detect = { path = "../qoop-detect" }
qoop-parsed = { path = "../qoop-parsed" }
rusqlite = { workspace = true }
# config.toml, the same file and crate the interface reads it with.
toml = { workspace = true }
# Writes it keeping its comments; the version the interface already uses.
toml_edit = { workspace = true }
unicode-width = "0.2"
tempfile = { workspace = true }

[dev-dependencies]
# Paused time for the tests that wait on a window.
tokio = { version = "1", features = ["test-util"] }
qoop-store = { path = "../qoop-store" }
qoop-testkit = { path = "../qoop-testkit" }
