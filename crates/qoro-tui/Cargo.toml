[package]
name = "qoro-tui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qoro-proto = { path = "../qoro-proto" }
qoro-runtime = { path = "../qoro-runtime" }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Already in the lock file by way of the terminal engine, so this adds a name and not a
# download. A multiplexer that counts characters where the terminal counts columns puts
# every wide character one column out.
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }
