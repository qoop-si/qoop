[package]
name = "qoro-tui"
version = "0.6.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qoro-proto = { path = "../qoro-proto" }
# What a state change is worth interrupting a person for, and how loudly: the same
# classification the push path uses, so the desktop and a phone never disagree.
qoro-attention = { path = "../qoro-attention" }
qoro-domain = { path = "../qoro-domain" }
qoro-runtime = { path = "../qoro-runtime" }
qoro-history = { path = "../qoro-history" }
qoro-remote = { path = "../qoro-remote" }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Pinned exact, not floating: desktop column counts must never drift under a
# `cargo update`. Bump only with a VT corpus re-run, because the engine has
# its own width table and the two must agree on every wide character.
unicode-width = "=0.2.2"
# Already in the lock file by way of qoro-detect and qoro-setup. config.toml is read as
# TOML, so dotted keys, inline tables and quoting behave the way the format says.
toml = { workspace = true }
# Already in the lock file under `toml`. Writing one setting keeps the person's comments.
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util", "process", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
