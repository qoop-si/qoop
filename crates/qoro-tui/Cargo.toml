[package]
name = "qoro-tui"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qoro-proto = { path = "../qoro-proto" }
# What a state change is worth interrupting a person for, and how loudly: the same
# classification the push path uses, so the desktop and a phone never disagree.
qoro-attention = { path = "../qoro-attention" }
qoro-domain = { path = "../qoro-domain" }
qoro-runtime = { path = "../qoro-runtime" }
qoro-remote = { path = "../qoro-remote" }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Already in the lock file by way of the terminal engine, so this adds a name and not a
# download. A multiplexer that counts characters where the terminal counts columns puts
# every wide character one column out.
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util", "process", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
