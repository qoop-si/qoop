[package]
name = "qoop-desktop"
version = "0.16.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The qoop desktop window: a person client of the daemon that paints its terminals."

[features]
# The Phase 0 measurements: a JSONL log, frame timing and a driver that types into the
# panes. Off in the product build.
bench = ["dep:libc"]

[[bin]]
name = "qoop-desktop"
path = "src/main.rs"

# macOS only for now: the GUI stack is built and measured there first, and the Linux CI
# job must not compile it. Elsewhere the binary only says it is not built for this system.
[target.'cfg(target_os = "macos")'.dependencies]
# Zed's GPUI straight from Zed's repository, pinned to one commit: its API changes between
# commits. `gpui_platform` is the same commit's window and text backend.
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false, features = ["font-kit"] }
# `runtime_shaders`: the Metal shaders compile when the app starts, as Herdr ships it; a
# build-time compile needs the separate Xcode Metal toolchain download.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false, features = ["font-kit", "runtime_shaders"] }
qoop-domain = { path = "../qoop-domain" }
qoop-proto = { path = "../qoop-proto" }
qoop-runtime = { path = "../qoop-runtime" }
# The mux the TUI speaks through (this machine and its remotes), the config file, seen, the
# icon font: linked as a library, so the window and the TUI cannot disagree about them.
qoop-tui = { path = "../qoop-tui" }
qoop-remote = { path = "../qoop-remote" }
bytes = { workspace = true }
libc = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
qoop-testkit = { path = "../qoop-testkit" }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false, features = ["font-kit", "test-support"] }
