# OpenCode (Anomaly / SST), the full-screen terminal interface.
#
# The strings below are from sst/opencode at 3f393d78 (2026-10-06, version 1.18.34), the
# session view in `packages/tui/src`. The busy spinner's glyphs (`■` and `⬝`) and the cut
# and fullscreen permission rows are from screens recorded in qoop's own opencode sessions
# (the captures in this crate's tests). Panels carry a border on their left side, so line
# patterns allow any non-word glyphs before the text. OpenCode's window title does not
# change with its state, so nothing here reads it.

id = "opencode"
version = "1"

# A permission request replaces the composer with a panel headed `△ Permission required`,
# then `△ Always allow` when that is chosen and `△ Reject permission` when asked for a
# reason, each with the hint `enter confirm` (`routes/session/permission.tsx`). The composer
# is not drawn while it is up, so the composer at the bottom rules this out: its
# placeholder within the last five rows, or its status row as the last line. The same words
# quoted in an answer have the composer under them; a placeholder quoted above a live panel
# is further up than that and does not count.
[[rules]]
id = "permission_panel"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(20)"
visible_blocker = true
all = [
  { line_regex = '^[^\w]*△ +(Permission required|Always allow|Reject permission)\s*$' },
  { any = [
    { contains = "enter confirm" },
    { line_regex = 'Allow once\s+Allow always\s+Reject\b' },
  ] },
]
not = [
  { regex = '(Ask anything|Run a command)… "[^\n]*(\n[^\n]*){0,4}\z' },
  { regex = '(?m)\s\S+ commands\s*\z' },
  { regex = 'esc exit shell mode[^\n]*\z' },
]

# The same panel expanded to the full screen pushes its header out of any bottom region,
# but its buttons stay at the bottom: ` Allow once   Allow always   Reject ` (or
# ` Confirm   Cancel `) beside or just over the hint `⇆ select`. The Reject stage has no
# buttons; its input row ends with `enter confirm  esc cancel` instead. The composer and its
# hints take those last rows whenever the panel is gone, so a quote never reaches them.
[[rules]]
id = "permission_buttons"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(4)"
visible_blocker = true
any = [
  { all = [
    { line_regex = '^[^\w]*(Allow once\s+Allow always\s+Reject|Confirm\s+Cancel)\b' },
    { contains = "⇆ select" },
  ] },
  { line_regex = '\benter confirm\s+esc cancel\s*\W*$' },
]

not = [
  { line_regex = '(Ask anything|Run a command)… "' },
  { line_regex = '\s\S+ commands\s*$' },
]

# A question from the model replaces the composer too; its footer hints end in
# `esc dismiss`, beside `↑↓ select` (`routes/session/question.tsx`).
[[rules]]
id = "question_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(3)"
visible_blocker = true
all = [
  { line_regex = 'esc dismiss\s*$' },
  { contains = "↑↓ select" },
]
not = [
  { line_regex = '(Ask anything|Run a command)… "' },
  { line_regex = '\s\S+ commands\s*$' },
]

# The row under the composer while the session is busy: an animated block spinner on the
# left (eight cells of `■` and `⬝` in a real session, `[⋯]` with animations off), and
# `esc interrupt` on the right (followed by the usage or agents hint and `<key> commands`),
# `esc again to interrupt` after one press, and while retrying
# `<message> [retrying in <duration> attempt #<n>]` (`component/prompt/index.tsx`).
[[rules]]
id = "busy_row"
state = "working"
priority = 200
region = "bottom_non_empty_lines(3)"
visible_working = true
any = [
  { line_regex = '^\s*([⬝■]{8}|\[⋯\])(\s|$)' },
  { line_regex = '\besc (again to )?interrupt\b' },
  { line_regex = '\[retrying (in .+ )?attempt #\d+\]' },
]

# The empty composer: `Ask anything… "<example>"`, or `Run a command… "<example>"` in
# shell mode (`component/prompt/index.tsx`, placeholderText).
[[rules]]
id = "composer_placeholder"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(8)"
visible_idle = true
line_regex = '^[^\w]*(Ask anything|Run a command)… "'

# `--session <id>` continues that session, `--continue` the last one (`opencode --help`, 2.0.27).
# `--standalone` runs the tab's own server: opencode 2 otherwise talks to one shared background
# service whose environment is the first tab's, and the qoop hook, loaded there, would report
# every tab as that one terminal. opencode 2 is the minimum; 1.x has no such flag.
[resume]
session = ["opencode", "--standalone", "--session", "{session}"]
latest = ["opencode", "--standalone", "--continue"]
