# Amp (Amp, formerly part of Sourcegraph).
#
# No detection rules. Amp is closed source and the part of its executable that draws the
# screen is compiled bytecode: the npm package @ampcode/cli 0.0.1791288059 yields the labels
# of its approval dialog and status line, but not where or how they are drawn, so nothing
# here could tell a live dialog from the same words quoted in an answer. It is read by the
# generic rules. What is here is how to carry its conversation across a restart.

id = "amp"
version = "1"

# From the help text in the executable: `amp threads continue <thread>` resumes that thread,
# `--last` the last one for this terminal and checkout.
[resume]
session = ["amp", "threads", "continue", "{session}"]
latest = ["amp", "threads", "continue", "--last"]
