# Qwen Code (the Qwen team at Alibaba).
#
# Every string below is from QwenLM/qwen-code at fd4af700 (2026-10-06): the components in
# `packages/cli/src/ui`, their snapshots, and the window title in
# `packages/cli/src/ui/utils/windowTitle.ts`. These are the English strings; Qwen Code
# translates its interface, and another locale is read only by its window title.

id = "qwen"
version = "1"

# A tool confirmation: a numbered radio list whose selected row carries `›`
# (`› 1. Yes, allow once`, `BaseSelectionList.tsx`) and whose last option ends `(esc)`:
# `No, suggest changes (esc)`, `No (esc)` in the shell command dialog, `No, keep planning
# (esc)` when leaving plan mode (`ToolConfirmationMessage.tsx`,
# `ShellConfirmationDialog.test.tsx.snap`). The composer's placeholder must not be there:
# the same words quoted in an answer have the composer under them.
[[rules]]
id = "tool_confirmation"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(30)"
visible_blocker = true
all = [
  { line_regex = '^[│\s]*› \d+\. ' },
  { line_regex = '^[│\s]*(› )?\d+\. (No, suggest changes|No|No, keep planning) \(esc\)\s*│?\s*$' },
]
not = [
  { contains = "Type your message or @path/to/file" },
  { contains = "Press 'i' for INSERT mode and 'Esc' for NORMAL mode." },
]

# The window title while a confirmation waits starts with `✳` (`windowTitle.ts`,
# `titleStatusPrefix`).
[[rules]]
id = "title_waiting_for_confirmation"
state = "blocked"
priority = 300
region = "osc_title"
visible_blocker = true
line_regex = '^✳'

# The folder trust dialog at startup: `Do you trust this folder?` over the option
# `Trust folder (<dir>)` (`FolderTrustDialog.tsx`).
# Qwen Code draws inline: the composer's prompt row under the same words means they were
# quoted.
[[rules]]
id = "trust_folder"
state = "blocked"
priority = 300
region = "whole_screen"
visible_blocker = true
setup_gate = true
all = [
  { line_regex = '^[│\s]*Do you trust this folder\?' },
  { line_regex = '^[│\s]*(› )?(\d+\. )?Trust folder \(' },
]
not = [{ line_regex = '^[│\s]*[>!] ' }]

# The loading line above the composer ends `(<time>[ · ↓ N tokens] · esc to cancel)`
# (`LoadingIndicator.tsx`). The phrase before it is random, so only the suffix is read.
[[rules]]
id = "esc_to_cancel"
state = "working"
priority = 200
region = "bottom_non_empty_lines(10)"
visible_working = true
line_regex = '\([^()]* · esc to cancel\)\s*│?\s*$'

# The window title while responding starts with `◐` (`windowTitle.ts`).
[[rules]]
id = "title_responding"
state = "working"
priority = 200
region = "osc_title"
visible_working = true
line_regex = '^◐'

# The composer: a prompt glyph (`>`, `!` in shell mode, `(r:)` in reverse search, or the
# approval mode's own) then the placeholder `  Type your message or @path/to/file`, or the
# vim mode one (`Composer.tsx`, `InputPrompt.tsx`).
[[rules]]
id = "composer_placeholder"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_idle = true
any = [
  { line_regex = '^[│\s]*\S+ +Type your message or @path/to/file' },
  { line_regex = "^[│\\s]*\\S+ +Press 'i' for INSERT mode and 'Esc' for NORMAL mode\\." },
]

# From `packages/cli/src/config/top-level-options.ts`: `--resume <id>` takes a session id,
# `--continue` the newest session of this project.
[resume]
session = ["qwen", "--resume", "{session}"]
latest = ["qwen", "--continue"]
