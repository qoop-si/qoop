# GitHub Copilot CLI (GitHub).
#
# Copilot CLI is closed source; its interface ships as minified JavaScript inside the
# executable. Every string below is from @github/copilot 1.0.92 (`cli-main.js`, extracted
# from @github/copilot-darwin-arm64). Its composer is a band between a row of `▄` above and
# a row of `▀` below, not between `─` rules.

id = "copilot"
version = "1"

# The model picker: `Select Model for <name>` or `Select Plan Mode Model`. The person opened
# it, and the last reading stands.
[[rules]]
id = "model_picker"
state = "unknown"
priority = 400
region = "bottom_non_empty_lines(30)"
skip_state_update = true
line_regex = '^\W*Select (Model for .+|Plan Mode Model)\s*\W*$'

# A permission dialog: its question (`Do you want to run this command?`,
# `Do you want to modify <file>?`, `Do you want to use this tool?`,
# `Do you want to allow this tool call?`, ...) and the footer
# `↑/↓ to navigate · enter to select · esc to cancel`. The composer's lower `▀` row rules it
# out: the same words quoted in an answer have the composer under them.
[[rules]]
id = "permission_dialog"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(40)"
visible_blocker = true
all = [
  { line_regex = '^\W*(Do you want to [^?]+\?|Switch to auto mode\?)' },
  { line_regex = '^\W*↑/↓ to navigate · enter to select · esc to cancel' },
]
not = [{ line_regex = '^\s*▀{3,}\s*$' }]

# Plan approval: the title `Plan Ready for Review`, with `to show full plan` or
# `to show summary` among its footer hints.
[[rules]]
id = "plan_review"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(40)"
visible_blocker = true
all = [
  { line_regex = '^\W*Plan Ready for Review' },
  { line_regex = 'to show (full plan|summary)' },
]
not = [{ line_regex = '^\s*▀{3,}\s*$' }]

# A question from the agent: the title `Question` with the free-text row
# `Other (type your answer below)` or `Type your answer...`.
[[rules]]
id = "question_dialog"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(30)"
visible_blocker = true
all = [
  { line_regex = '^\W*Question\s*\W*$' },
  { line_regex = '(Other \(type your answer below\)|Type your answer\.\.\.)' },
]
not = [{ line_regex = '^\s*▀{3,}\s*$' }]

# Folder trust: `Confirm folder trust` over `Do you trust the files in this folder?`.
# The composer's lower `▀` row under the same words means they were quoted.
[[rules]]
id = "folder_trust"
state = "blocked"
priority = 300
region = "whole_screen"
visible_blocker = true
setup_gate = true
all = [
  { line_regex = '^\W*Confirm folder trust' },
  { line_regex = '^\W*Do you trust the files in this folder\?' },
]
not = [{ line_regex = '^\s*▀{3,}\s*$' }]

# The working line: the intent (or `Working`, `Executing`) then a dim `(Esc to cancel)`.
[[rules]]
id = "esc_to_cancel"
state = "working"
priority = 200
region = "bottom_non_empty_lines(10)"
visible_working = true
line_regex = '\S \(Esc to cancel\)\s*$'

# The composer band: a `▄` row, the prompt `❯ `, and a `▀` row.
[[rules]]
id = "composer"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(8)"
visible_idle = true
all = [
  { line_regex = '^\s*▄{3,}\s*$' },
  { line_regex = '^\s*❯ ' },
  { line_regex = '^\s*▀{3,}\s*$' },
]

# From the executable's own messages: `--resume=<session-id>` and `--continue`.
[resume]
session = ["copilot", "--resume={session}"]
latest = ["copilot", "--continue"]
