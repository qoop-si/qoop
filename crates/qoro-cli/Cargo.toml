[package]
name = "qoro-cli"
version = "0.6.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "qoro"
path = "src/main.rs"

[dependencies]
qoro-setup = { path = "../qoro-setup" }
qoro-runtime = { path = "../qoro-runtime" }
qoro-tui = { path = "../qoro-tui" }
qoro-remote = { path = "../qoro-remote" }
tempfile = { workspace = true }
qoro-history = { path = "../qoro-history" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
qoro-proto = { path = "../qoro-proto" }
qoro-store = { path = "../qoro-store" }
qoro-pty = { path = "../qoro-pty" }

[dev-dependencies]
bytes = { workspace = true }
qoro-pty = { path = "../qoro-pty" }
qoro-proto = { path = "../qoro-proto" }
serde_json = { workspace = true }
qoro-store = { path = "../qoro-store" }
qoro-testkit = { path = "../qoro-testkit" }
libc = { workspace = true }
tempfile = { workspace = true }
