[package]
name = "qoop-cli"
version = "0.13.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "qoop"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
qoop-setup = { path = "../qoop-setup" }
qoop-runtime = { path = "../qoop-runtime" }
qoop-tui = { path = "../qoop-tui" }
qoop-remote = { path = "../qoop-remote" }
tempfile = { workspace = true }
qoop-history = { path = "../qoop-history" }
qoop-parsed = { path = "../qoop-parsed" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
qoop-proto = { path = "../qoop-proto" }
qoop-domain = { path = "../qoop-domain" }
qoop-store = { path = "../qoop-store" }
qoop-pty = { path = "../qoop-pty" }

[dev-dependencies]
bytes = { workspace = true }
qoop-pty = { path = "../qoop-pty" }
qoop-proto = { path = "../qoop-proto" }
serde_json = { workspace = true }
qoop-store = { path = "../qoop-store" }
qoop-testkit = { path = "../qoop-testkit" }
tempfile = { workspace = true }
