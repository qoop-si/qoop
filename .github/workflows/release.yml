name: release

# On every push to main, release-please keeps the Release PR up to date (version in every crate and
# Cargo.lock, CHANGELOG.md). Merging that PR makes a draft release and its tag; the jobs below build
# every platform of the app build (these crates with the phone part from qoop-si/private) and the
# Android app, attach them, publish the draft, then ask deploq on the hub host to copy the release
# to qoop.si, where clients read it. Started by hand, it is a dry run: main is built with its current
# version and nothing is published or uploaded, and the iPhone app is built unsigned for a device as
# well. `private_ref` names the private branch or commit a dry run builds (private's main when empty);
# its logs are public as every run's are: the ref's name, file paths and compiler errors.
#
# Secrets, environment `release` (deployment branch main only):
#   PRIVATE_READ_KEY      read-only deploy key of qoop-si/private
#   ANDROID_KEYSTORE_B64  the release keystore, base64; every APK must be signed by it
#   ANDROID_KEY_ALIAS     its key alias
#   ANDROID_KEY_PASSWORD  its password
#   DEPLOQ_TOKEN          token of deploq's qoop-releases project on the hub host
#   MAC_P12_B64           the Developer ID Application certificate and key, p12, base64 (desktop app)
#   MAC_P12_PASSWORD      its password
#   ASC_KEY_ID            App Store Connect API key id, for notarytool
#   ASC_ISSUER_ID         its issuer id
#   ASC_KEY_P8            the key itself (.p8 text)
# Without MAC_P12_B64 the desktop app is built and checked only: no zip goes out.
#
# No cache anywhere here: a pull request's run can read main's caches, and these jobs compile
# private code. A failed run is finished with "Re-run failed jobs" on the same run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      private_ref:
        description: The qoop-si/private branch or commit to build (empty is its main)
        required: false
        type: string
        default: ''

permissions: {}

# A dry run publishes nothing, so it never holds up a release run.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  prep:
    needs: please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.please.outputs.released == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.refs.outputs.version }}
      qoop_ref: ${{ steps.refs.outputs.qoop_ref }}
      private_ref: ${{ steps.refs.outputs.private_ref }}
      release_key: ${{ steps.refs.outputs.release_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && needs.please.outputs.tag || github.sha }}
          path: qoop
          persist-credentials: false
      # Every job builds the same private commit, whatever lands on its main meanwhile. A release
      # always builds private's main; only a dry run takes another ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qoop-si/private
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.private_ref || '' }}
          ssh-key: ${{ secrets.PRIVATE_READ_KEY }}
          path: private
          persist-credentials: false
      - id: refs
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.please.outputs.tag }}
          ASKED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.private_ref || '' }}
        run: |
          # The release key signs only private's main: a release, or a dry run that names no ref.
          # A branch nobody released builds and runs its own scripts, so it never sees the key.
          release_key=false
          if [ "$EVENT" = push ] || [ -z "$ASKED_REF" ]; then release_key=true; fi
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' qoop/crates/qoop-runtime/Cargo.toml | head -n 1)"
          if [ "$EVENT" = push ]; then
            printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "not a release tag: '$TAG'"; exit 1; }
            [ "$crate" = "${TAG#v}" ] || { echo "the tag says $TAG, qoop-runtime says $crate"; exit 1; }
          fi
          {
            echo "version=$crate"
            echo "qoop_ref=$(git -C qoop rev-parse HEAD)"
            echo "private_ref=$(git -C private rev-parse HEAD)"
            echo "release_key=$release_key"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, triple: aarch64-apple-darwin }
          # Native, so its binary is started for real; this runner ends in August 2027.
          - { os: macos-15-intel, triple: x86_64-apple-darwin }
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, zig: x86_64 }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, zig: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prep.outputs.qoop_ref }}
          path: qoop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qoop-si/private
          ref: ${{ needs.prep.outputs.private_ref }}
          ssh-key: ${{ secrets.PRIVATE_READ_KEY }}
          path: private
          persist-credentials: false
      # Linux builds against glibc 2.17 through zig, the arm one too, so one binary starts on every
      # glibc distribution from the last decade. Both tools from their own releases, checksummed.
      - name: zig and cargo-zigbuild
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.zig }}
        run: |
          case "$ARCH" in
            x86_64)
              zig_sum=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
              czb_sum=6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59 ;;
            aarch64)
              zig_sum=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
              czb_sum=25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419 ;;
          esac
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/0.15.2/zig-$ARCH-linux-0.15.2.tar.xz"
          echo "$zig_sum  zig.tar.xz" | sha256sum -c
          curl -fsSLo czb.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-$ARCH-unknown-linux-gnu.tar.xz"
          echo "$czb_sum  czb.tar.xz" | sha256sum -c
          tar -xJf zig.tar.xz
          tar -xJf czb.tar.xz
          echo "$tools/zig-$ARCH-linux-0.15.2" >> "$GITHUB_PATH"
          echo "$tools/cargo-zigbuild-$ARCH-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Target
        working-directory: private
        env:
          TRIPLE: ${{ matrix.triple }}
        run: rustup target add "$TRIPLE"
      - name: Build, start and pack
        working-directory: private
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: ./scripts/release-build.sh "$VERSION" "$TRIPLE"
      # A dry run's build may be of an unreleased private branch, and this repository's artifacts
      # are public: it never leaves the runner.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.triple }}
          path: private/dist/*.tar.gz*
          retention-days: 7
          if-no-files-found: error

  apk:
    needs: prep
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qoop-si/private
          ref: ${{ needs.prep.outputs.private_ref }}
          ssh-key: ${{ secrets.PRIVATE_READ_KEY }}
          path: private
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # The NDK and cmake the app's gradle build names; the runner image carries other versions.
      - name: Android SDK
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - name: Keystore
        if: needs.prep.outputs.release_key == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      # A dry run of another private ref signs with a key made here and thrown away: its APK never
      # leaves the runner, and the build's own scripts never see the release key or its password.
      - name: Throwaway keystore
        if: needs.prep.outputs.release_key != 'true'
        run: |
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.keystore" \
            -alias throwaway -storepass throwaway -keypass throwaway -keyalg RSA -keysize 2048 \
            -validity 1 -dname CN=throwaway
      - name: Build and check
        working-directory: private
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          QOOP_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          QOOP_ANDROID_KEY_ALIAS: ${{ needs.prep.outputs.release_key == 'true' && secrets.ANDROID_KEY_ALIAS || 'throwaway' }}
          QOOP_ANDROID_KEY_PASSWORD: ${{ needs.prep.outputs.release_key == 'true' && secrets.ANDROID_KEY_PASSWORD || 'throwaway' }}
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./scripts/release-apk-build.sh "$VERSION"
      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      # A dry run's APK carries the versionCode of a shipped one, so it never leaves the runner.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: private/dist/qoop-android-arm64.apk
          retention-days: 7
          if-no-files-found: error

  # The iPhone app on a dry run only: the app and its widget extension compiled for a device, with no
  # signing, no simulator and nothing uploaded. iOS ships by hand (TestFlight), never from here. Xcode is
  # the one Expo SDK 57 is made for; the runner's default moves without notice. As the APK's, the build's
  # output goes to a file and only its error lines reach the public log.
  ios:
    needs: prep
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.prep.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qoop-si/private
          ref: ${{ needs.prep.outputs.private_ref }}
          ssh-key: ${{ secrets.PRIVATE_READ_KEY }}
          path: private
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Build for a device, unsigned
        working-directory: private/mobile
        run: |
          log="$RUNNER_TEMP/ios-build.log"
          set +e
          (
            set -e
            bun install --frozen-lockfile
            bunx expo prebuild -p ios --no-install
            cd ios
            pod install
            xcodebuild -workspace qoop.xcworkspace -scheme qoop -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
          ) > "$log" 2>&1
          built=$?
          set -e
          if [ "$built" -ne 0 ]; then
            echo "the iOS build failed (exit $built); its error lines:"
            grep -E 'error:|\*\* BUILD FAILED|\[!\]' "$log" | sort -u | head -n 40 || true
            exit 1
          fi
          app="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/qoop.app"
          [ -d "$app" ] || { echo "no qoop.app came out of the build"; exit 1; }
          ls "$app/PlugIns"

  # The desktop app, a job of its own outside `build`: a GPUI or notary failure never holds up the CLI
  # release. `publish` waits for it and goes on when it failed. A zip goes out only signed with the
  # Developer ID and notarized; without the signing secrets the app is built and checked, and no zip
  # is made, so an ad hoc app never sits under the release's names.
  desktop:
    needs: prep
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      HAS_SIGNING: ${{ secrets.MAC_P12_B64 != '' }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prep.outputs.qoop_ref }}
          path: qoop
          persist-credentials: false
      - name: Build and bundle
        working-directory: qoop
        run: |
          cargo build -p qoop-desktop --release --locked
          sh crates/qoop-desktop/bundle.sh --binary target/release/qoop-desktop "$RUNNER_TEMP/out"
      # After every compile step, so no build step runs with the key in a keychain.
      - name: Sign and notarize
        if: env.HAS_SIGNING == 'true'
        env:
          MAC_P12_B64: ${{ secrets.MAC_P12_B64 }}
          MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$MAC_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the p12"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$identity" "$RUNNER_TEMP/out/qoop.app"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/out/qoop.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$RUNNER_TEMP/out/qoop.app"
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict "$RUNNER_TEMP/out/qoop.app"
          "$RUNNER_TEMP/out/qoop.app/Contents/MacOS/qoop-desktop" --version
      - name: Zip and checksum
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/out/qoop.app" "dist/qoop-desktop-$TRIPLE.zip"
          (cd dist && shasum -a 256 "qoop-desktop-$TRIPLE.zip" > "qoop-desktop-$TRIPLE.zip.sha256")
      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/key.p8"
      # Only a release uploads: a dry run leaves nothing behind.
      - if: env.HAS_SIGNING == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.triple }}
          path: dist/qoop-desktop-*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [please, prep, build, apk, desktop]
    # Waits for the desktop app and goes on without it when it failed.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.please.outputs.released == 'true' && needs.build.result == 'success' && needs.apk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Every file, every checksum
        working-directory: dist
        run: |
          for triple in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            for name in "qoop-$triple.tar.gz" "qoro-$triple.tar.gz"; do
              [ -s "$name" ] && [ -s "$name.sha256" ] || { echo "missing $name"; exit 1; }
            done
          done
          [ -s qoop-android-arm64.apk ] || { echo "missing the APK"; exit 1; }
          sha256sum --quiet -c ./*.sha256
          ls -l
      - name: Notes
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/changes.md"
          # A re-run finds the block already there and writes it again over the changes below it: a
          # desktop leg that failed the first time may have made its zips now. A block without the
          # Docs line it ends on is left as it is.
          if grep -q 'qoop.si/install.sh' "$RUNNER_TEMP/changes.md"; then
            grep -qx -- '- Docs: https://qoop.si/docs/' "$RUNNER_TEMP/changes.md" || exit 0
            sed '1,/^- Docs: https:\/\/qoop\.si\/docs\/$/d' "$RUNNER_TEMP/changes.md" | sed '1{/^$/d;}' > "$RUNNER_TEMP/rest.md"
            mv "$RUNNER_TEMP/rest.md" "$RUNNER_TEMP/changes.md"
          fi
          {
            echo 'Install on macOS or Linux:'
            echo
            echo '```'
            echo 'curl -fsSL https://qoop.si/install.sh | sh'
            echo '```'
            echo
            echo 'Already installed: `qoop update`, which moves every computer you added along with it.'
            echo
            echo '- Android: `qoop-android-arm64.apk` below. Installed once, the app offers each new version in Settings.'
            # Only the zips this release really has: one leg may have failed.
            macs=""
            [ -s dist/qoop-desktop-aarch64-apple-darwin.zip ] && macs="\`qoop-desktop-aarch64-apple-darwin.zip\` (Apple silicon)"
            if [ -s dist/qoop-desktop-x86_64-apple-darwin.zip ]; then
              intel="\`qoop-desktop-x86_64-apple-darwin.zip\` (Intel)"
              macs="${macs:+$macs or }$intel"
            fi
            if [ -n "$macs" ]; then
              echo "- Desktop app for macOS: $macs below; unzip it into Applications. It uses the \`qoop\` the line above installs."
            fi
            echo '- iPhone and any browser: https://qoop.si/app'
            echo '- Docs: https://qoop.si/docs/'
            echo
            cat "$RUNNER_TEMP/changes.md"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Upload and publish
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/qoop-android-arm64.apk --repo "$REPO" --clobber
          # The desktop app only when its job made it.
          if ls dist/qoop-desktop-*.zip >/dev/null 2>&1; then
            gh release upload "$TAG" dist/qoop-desktop-*.zip dist/qoop-desktop-*.zip.sha256 --repo "$REPO" --clobber
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  # A job of its own, so "Re-run failed jobs" after a hub problem leaves the published release alone.
  # deploq on the hub host copies the release from GitHub; the token POST starts it, and it is sent
  # again until qoop.si names the version. A random sha each time, so deploq never takes it for the
  # commit it deployed last.
  hub:
    needs: [please, publish]
    # After a published release, whatever the desktop app did: a failed desktop leg must not keep
    # qoop.si (install.sh, qoop update) on the old version.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.please.outputs.released == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions: {}
    env:
      TAG: ${{ needs.please.outputs.tag }}
    steps:
      - name: Onto qoop.si
        env:
          DEPLOQ_TOKEN: ${{ secrets.DEPLOQ_TOKEN }}
        run: |
          for _try in 1 2 3 4 5; do
            sha="$(openssl rand -hex 20)"
            said="$(curl -sS -m 30 -X POST https://qoop.si/webhook/qoop-releases \
              -H "X-Deploq-Token: $DEPLOQ_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"ref\":\"refs/heads/main\",\"sha\":\"$sha\"}" || true)"
            echo "deploq: $said"
            case "$said" in
              *'"status":"accepted"'* | *'"status":"coalesced"'*) ;;
              # No answer (the network): try again. Any other answer is a refusal (token, payload).
              "") ;;
              *) echo "deploq did not take it"; exit 1 ;;
            esac
            for _poll in 1 2 3 4 5 6 7 8; do
              sleep 15
              if curl -fsS -m 20 https://qoop.si/releases/latest | grep -q "\"tag_name\":\"$TAG\""; then
                echo "qoop.si serves $TAG"
                exit 0
              fi
            done
          done
          echo "qoop.si does not serve $TAG after 10 minutes: see journalctl -u deploq on the hub host"
          exit 1
