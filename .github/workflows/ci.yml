name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Compiled dependencies come back from main's last run; only main writes the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prose
        run: uv run --no-project python scripts/check-prose.py
      - name: Unsafe
        run: uv run --no-project python scripts/check-unsafe.py
      - name: ADRs
        run: uv run --no-project python scripts/check-adrs.py
      - name: Install script
        run: sh scripts/install-check.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The shell tests run against zsh and fish too; a Linux runner has bash and dash only.
      - name: Shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      # The desktop window builds on macOS only, so the Linux lint job never sees it.
      - name: Clippy (desktop)
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p qoop-desktop --all-targets --locked -- -D warnings
          cargo clippy -p qoop-desktop --all-targets --all-features --locked -- -D warnings
      # The idle CPU gates measure a quiet machine; a shared runner is not one.
      - name: Test
        env:
          # Full debug info for every test binary fills the Linux runner's disk.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo test --workspace --locked --no-fail-fast -- --skip costs_almost_nothing
      # The app bundle from a debug build (cargo test does not build the binary): bundled, signed
      # ad hoc, verified, asked its version, and kept as an artifact. No release compile on PRs.
      - name: Bundle (desktop)
        if: runner.os == 'macOS'
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          cargo build -p qoop-desktop --locked
          sh crates/qoop-desktop/bundle.sh --binary target/debug/qoop-desktop dist
          codesign --verify --deep --strict dist/qoop.app
          dist/qoop.app/Contents/MacOS/qoop-desktop --version
          ditto -c -k --keepParent dist/qoop.app dist/qoop-desktop-debug.zip
      - name: Keep the bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qoop-desktop-debug
          path: dist/qoop-desktop-debug.zip
          retention-days: 7
