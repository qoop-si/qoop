# Whether a GPUI window shows its accessibility tree to macOS: GPUI's own a11y example at the
# pinned rev and the desktop window, each started on a macOS runner and read twice through the
# AX API. A probe for the desktop app's accessibility finding; it goes once that is settled.
name: a11y probe

on:
  push:
    branches: [feat/desktop-v1]
    paths:
      - .github/a11y/**
      - .github/workflows/a11y-probe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GPUI_REV: d2a4fb6ded7c470be25d1541281da3882495b65b

jobs:
  gpui-example:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AX tool
        run: |
          swiftc -O .github/a11y/ax.swift -o "$RUNNER_TEMP/ax"
          echo "trusted: $("$RUNNER_TEMP/ax" trusted)"
      - name: GPUI at the pin
        run: |
          git init -q "$RUNNER_TEMP/zed"
          cd "$RUNNER_TEMP/zed"
          git remote add origin https://github.com/zed-industries/zed
          git fetch -q --depth 1 origin "$GPUI_REV"
          git checkout -q FETCH_HEAD
          cargo build -p gpui --example a11y
      - name: Probe
        env:
          RUST_LOG: gpui=info
        run: |
          sh .github/a11y/probe.sh "$RUNNER_TEMP/ax" "$RUNNER_TEMP/out" gpui-a11y \
            "$RUNNER_TEMP/zed/target/debug/examples/a11y"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-probe-gpui-example
          path: ${{ runner.temp }}/out
          retention-days: 7

  desktop:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AX tool
        run: |
          swiftc -O .github/a11y/ax.swift -o "$RUNNER_TEMP/ax"
          echo "trusted: $("$RUNNER_TEMP/ax" trusted)"
      - name: Desktop window
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo build -p qoop-desktop --locked
      # An isolated stack with no daemon: the window draws its first page all the same.
      - name: Probe
        run: |
          s=$(mktemp -d)
          env QOOP_RUNTIME_DIR="$s" XDG_CONFIG_HOME="$s/c" XDG_DATA_HOME="$s/d" \
            QOOP_DESKTOP_A11Y="$RUNNER_TEMP/out/desktop-tree.json" \
            sh .github/a11y/probe.sh "$RUNNER_TEMP/ax" "$RUNNER_TEMP/out" desktop \
            target/debug/qoop-desktop
          echo "== GPUI's own tree, last frame: $(grep -c accesskit_id "$RUNNER_TEMP/out/desktop-tree.json" 2> /dev/null || echo none) nodes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-probe-desktop
          path: ${{ runner.temp }}/out
          retention-days: 7
