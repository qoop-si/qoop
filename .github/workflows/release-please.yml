name: release-please

# Versions and releases are decided by the commit messages, not by hand. A `feat:` moves the
# minor, a `fix:` moves the patch, and anything with a breaking marker moves the major. The
# action opens a release pull request and keeps it up to date as more commits land; merging
# that pull request is what tags and publishes the release.
#
# Nothing here edits a version directly, and nothing here publishes to a registry: the crates
# are unpublished and the release is the tag plus the changelog.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # `rust` rather than `simple`, because the version has to reach the binary: `qoro
      # --version` prints `CARGO_PKG_VERSION`, so a release that left the manifests at their
      # old number would ship a binary that reports the wrong one. The strategy updates the
      # workspace members and the lockfile with it.
      # The config file rather than inline inputs, because `bump-minor-pre-major` is what
      # keeps a `feat:` on a 0.x version from being read as a major release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
