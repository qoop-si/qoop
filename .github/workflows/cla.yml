name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action never checks out the pull request's code; it only reads comments and writes
# signatures/cla.json on the cla-signatures branch, which must stay unprotected.
permissions: {}

jobs:
  cla:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/qoop-si/qoop/blob/main/CLA.md
          branch: cla-signatures
          allowlist: qoopsy,*[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
